app = "openable"
primary_region = "iad"

# The server drains in-flight rescues for up to 45s on SIGTERM. Killing it sooner would
# orphan a running Solari VM, which the account keeps paying for.
kill_signal = "SIGTERM"
kill_timeout = "60s"

[build]

[env]
  PORT = "3000"
  SOLARI_MAX_CONCURRENCY = "1"
  # Kept well under the machine's memory, since results are held in process.
  OPENABLE_MAX_RESULT_MB = "128"
  OPENABLE_RATE_LIMIT_PER_MINUTE = "5"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  # Suspend rather than stop, so a cold request does not wait for a full boot.
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # A rescue occupies the single Solari VM slot, so queueing here is deliberate.
    soft_limit = 4
    hard_limit = 8

[checks.health]
  type = "http"
  port = 3000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

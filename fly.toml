app = "openable"
primary_region = "iad"

[build]

[env]
  PORT = "3000"
  SOLARI_MAX_CONCURRENCY = "1"

[http_service]
  internal_port = 3000
  force_https = true
  auto_start_machines = true
  # Suspend rather than stop, so a cold request does not wait for a full boot.
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    # A rescue occupies the single Solari VM slot, so queueing here is deliberate.
    soft_limit = 4
    hard_limit = 8

[checks.health]
  type = "http"
  port = 3000
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

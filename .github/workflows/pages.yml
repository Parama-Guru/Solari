name: Publish the site to GitHub Pages

# The landing page is a single static file, so Pages can serve it for free and it never
# spins down. The playground detects that no API is behind it and shows how to run it locally.

on:
  push:
    branches: [main]
    paths: ['src/server/public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/server/public

      - id: deploy
        uses: actions/deploy-pages@v4

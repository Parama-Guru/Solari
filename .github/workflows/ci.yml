name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - run: npm ci

      - run: npm run typecheck

      # No API key here on purpose: everything below must pass without touching Solari.
      - run: npm test

      - run: npm run build

      # Packaging breaks quietly: a missing shebang, an asset tsc never copies, or a file
      # left out of `files` all pass the tests and fail only for whoever installs it.
      - name: Install the packed package and use it
        run: |
          set -e
          TARBALL=$(npm pack --silent)
          mkdir -p /tmp/consumer && cd /tmp/consumer
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/$TARBALL" --ignore-scripts

          test -x node_modules/.bin/openable-mcp || { echo "openable-mcp is not executable"; exit 1; }
          test -x node_modules/.bin/openable-playground || { echo "openable-playground is not executable"; exit 1; }
          test -f node_modules/openable/dist/server/public/index.html || { echo "the page was not published"; exit 1; }
          test -f node_modules/openable/samples/broken.pdf || { echo "samples were not published"; exit 1; }

          node --input-type=module -e "
            const m = await import('openable');
            const pdf = new Uint8Array([0x25,0x50,0x44,0x46,0x2d,0x31,0x2e,0x37]);
            const d = m.detect(pdf, 'lies.docx');
            if (d.format !== 'PDF') { console.error('detect returned', d.format); process.exit(1); }
            console.log('public API works, and the bytes beat the extension');
          "

          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}' \
            | node node_modules/openable/dist/mcp/server.js | grep -q '"openable"'
          echo "MCP server responds from the installed package"
